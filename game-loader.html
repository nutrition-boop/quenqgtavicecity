<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>VC Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #171c20; color: #fff; font-family: Arial, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; background: #171c20; }
    #loader h1 { font-size: 2em; color: #ff2d95; margin-bottom: 10px; }
    #loader p { color: #aaa; margin-bottom: 20px; font-size: 0.9em; }
    #progress-bar { width: 300px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    #progress-fill { width: 0%; height: 100%; background: #ff2d95; transition: width 0.3s; }
    #progress-text { margin-top: 8px; font-size: 0.85em; color: #888; }
    #play-btn { padding: 15px 50px; font-size: 1.2em; background: #ff2d95; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #play-btn:hover { background: #e0267f; }
    #canvas-container { width: 100%; height: 100%; }
    canvas { width: 100% !important; height: 100% !important; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loader">
    <h1>GTA Vice City Online</h1>
    <p>Click Play to start</p>
    <button id="play-btn" onclick="startLoading()">▶ PLAY GAME</button>
    <div id="loading-ui" class="hidden">
      <p>LOADING...</p>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-text">0%</div>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <div id="move" style="position:fixed;left:0;bottom:0;width:30vw;height:40vh;z-index:50;"></div>
  <div id="look" style="position:fixed;right:0;bottom:0;width:30vw;height:40vh;z-index:50;"></div>

  <script>
    function startLoading() {
      document.getElementById('play-btn').classList.add('hidden');
      document.getElementById('loading-ui').classList.remove('hidden');

      window.VCSKY = window.VCSKY || {};
      window.VCSKY.activeMods = [];
      window.VCSKY.onProgress = function(p) {
        document.getElementById('progress-fill').style.width = p + '%';
        document.getElementById('progress-text').textContent = p + '%';
      };
      window.VCSKY.onReady = function() {
        document.getElementById('loader').classList.add('hidden');
      };

      // Load scripts in order
      loadScript('/game-engine/assets/js/GamepadEmulator.js', function() {
        loadScript('/game-engine/assets/js/idbfs.js', function() {
          loadScript('/game-engine/assets/js/game.js', function() {
            window.VCSKY.start();
          });
        });
      });
    }

    function loadScript(src, cb) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = cb;
      s.onerror = function() { alert('Failed to load: ' + src); };
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
